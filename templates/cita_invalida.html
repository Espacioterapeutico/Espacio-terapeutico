<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlace Inválido</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5d3a6f;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2b2b2b;
            --border: #e2e8f0;
            --radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1.25rem; }
        .container { width: 100%; max-width: 400px; background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; text-align: center; padding: 2rem; }
        h2 { color: #dc2626; margin-bottom: 1rem; }
        p { color: #4b5563; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚠️ Enlace Expirado</h2>
        <p>{{ mensaje }}</p>
    </div>
</body>
</html>
